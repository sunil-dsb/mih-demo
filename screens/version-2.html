.vnav{display:flex;gap:8px;flex-wrap:wrap}.vnav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #6F7582;background:#fff;color:#14213D;font-weight:600;text-decoration:none}.vnav a[aria-current=page]{background:#14213D;border-color:#14213D;color:#fff}
/* the concept screens were drawn at 390 x 844, so this board's phone is that size inside its bezel (9px each side) */

body{margin:0;background:#F6F7F9;font-family:Inter,system-ui,sans-serif;color:#151923}

.group{max-width:1900px;margin:0 auto;padding:24px 24px 0}
.group h2{font-size:20px;line-height:1.3;margin:0 0 0 8px;color:#14213D}
.group:last-of-type{padding-bottom:80px}
.screen{background:#fff}
.screen iframe{display:block;width:100%;height:100%;border:0}
.sb-over{position:absolute;top:0;left:0;right:0;height:50px;padding:0 30px 6px;z-index:5;pointer-events:none}
@media (max-width:480px){.group{padding:16px 0 0}.board-head{padding:24px 16px 0}}
/* board mobile */
@media (max-width:480px){.board-head{padding:20px 16px 0;gap:12px}.board-head h1{font-size:20px}.group{padding:16px 0 0}.group h2{margin-left:16px}main.screens-row{padding:8px 0 48px}}
